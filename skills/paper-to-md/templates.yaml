# 论文解析模板配置

# 默认模板（三遍阅读法）
default:
  name: "三遍阅读法"
  description: "使用三遍阅读法深度解析论文"
  
  # 系统角色设定
  role: |
    你是一位AI开发者，精通LLM、Agent等领域的知识，同时，你精通各种大模型训练、微调、强化学习等技术。你的回答必须严谨、具备学术洞察力、具有启发性和指导性。
  
  # 输出规范
  output_spec: |
    严谨性： 涉及数学公式请使用 LaTeX 格式。
    逻辑性： 使用分级标题，条理清晰地阐述技术细节。
    批判性： 在提供方案的同时，必须列出该方案可能的 潜在弱点 (Pitfalls) 或 实施难点。
    视觉化建议： 如果涉及复杂架构，请用文字描述生成其计算流图 (Computational Graph) 或层级结构。
  
  # 参考方法
  reference: |
    三遍阅读法：
    第1遍（5分钟）：标题+摘要+结论+图表 → 判断值不值得读
    第2遍（15分钟）：引言+方法框架+实验设置 → 抓住核心思路
    第3遍（按需）：细节推导/代码/附录 → 深度复现时才需要
  
  # 规则
  rules:
    - "不要试图思考过往记忆"
    - "一次性生成最终笔记，禁止在分析前生成草稿"
    - "请严格按照Context要求的内容和格式生成，禁止随意添加或修改"
  
  # 内容模板
  template: |
    ## 论文基本信息
    >列出论文信息标题、作者、提交时间、arXiv编号、领域、（项目仓库地址）等，注意不要使用表格
    
    ## 三遍阅读法解析
    ### 第1遍：标题+摘要+结论+图表（5分钟）
    >判断值不值得读
    
    ### 第2遍：引言+方法框架+实验设置（15分钟）
    >抓住核心思路
    
    ### 第3遍：细节推导/代码/附录（按需）
    >深度复现时才需要
    
    ## {paper_title}-工程视角
    
    ### 🔑核心洞见
    >用 1 句话说清楚：改变了对__的认知？
    
    ### 🔧工程动作(3-5条，维度开放)
    >格式：-[方向]：具体动作+预期收益/适用条件
    >例：-[模型]：MoE loss加entropy正则，缓解expert坍塌(适用top-k=1)
    
    ### ❓待验证假设
    > 这个思路最大的风险/不确定性是什么？
    >未来还有哪些工作和研究方向
    
    ### 🏷️标签
    > 根据内容，生成几个易于检索的小标签
    
    ### 📚相关推荐
    > 根据论文摘要、正文和参考文献，筛选出 Top3 推荐阅读的相关论文，注意，如果有些前置论文是读懂此论文的先决条件，这些前置论文应具有更高优先级。

# 快速笔记模板
quick_note:
  name: "快速笔记"
  description: "快速提取论文核心要点"
  
  role: "你是一位研究助手，擅长快速提取论文核心信息。"
  
  template: |
    ## 基本信息
    - 标题：{paper_title}
    - 作者：{paper_authors}
    - arXiv：{arxiv_id}
    
    ## 核心贡献
    > 用3-5句话概括论文的核心贡献
    
    ## 关键方法
    > 简述方法的核心思路
    
    ## 实验结果
    > 主要实验结果和发现
    
    ## 个人笔记
    > 阅读笔记和思考

# 文献综述模板
literature_review:
  name: "文献综述"
  description: "用于文献综述的结构化模板"
  
  role: "你是一位学术写作专家，擅长撰写结构化的文献综述。"
  
  template: |
    ## 论文信息
    - 标题：{paper_title}
    - 作者：{paper_authors}
    - 年份：{year}
    - 来源：{venue}
    
    ## 研究问题
    > 这篇论文解决什么问题？
    
    ## 方法论
    > 采用什么方法？有哪些创新点？
    
    ## 主要发现
    > 核心结论和实验结果
    
    ## 局限性
    > 方法的局限和不足
    
    ## 与相关工作对比
    > 与其他方法的对比分析
    
    ## 启示
    > 对未来研究的启示